<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foreign Employee Management</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background:#f1f5f9}.input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;margin-bottom:10px}.btn{background:#2563eb;color:#fff;font-weight:700;padding:10px 14px;border-radius:8px}.secondary{background:#fff;border:1px solid #cbd5e1;padding:10px 14px;border-radius:8px}.modal{background:#0008}.badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}</style></head><body class="text-slate-800"><nav class="bg-slate-900 text-white p-4 flex justify-between"><b>🌐 FOREIGN EMPLOYEE MANAGEMENT</b><div id="userNav" class="hidden gap-3 items-center"><span id="userName"></span><span id="roleBadge" class="bg-blue-600 px-2 rounded-full text-xs"></span><button onclick="logout()">↪</button></div></nav><section id="login" class="max-w-md mx-auto mt-16 bg-white p-8 rounded-2xl shadow"><h1 class="text-2xl font-bold mb-6 text-center">ĐĂNG NHẬP</h1><input id="u" class="input" placeholder="Email / Mã NV"><input id="p" type="password" class="input" placeholder="Mật khẩu"><button id="lb" onclick="login()" class="btn w-full">Đăng nhập</button></section><main id="app" class="hidden max-w-7xl mx-auto p-4"><div class="flex flex-wrap gap-2 mb-5"><button id="dm" class="secondary" onclick="page('dash')">📊 Dashboard</button><button class="secondary" onclick="page('profile')">👤 My Profile</button><button class="secondary" onclick="page('imm')">✈️ Immigration</button><button class="secondary" onclick="page('travel')">🚗 Domestic Travel</button><button id="em" class="secondary" onclick="page('employees')">👥 Foreign Employees</button></div><section id="dash" class="pg hidden"><div class="grid grid-cols-2 md:grid-cols-5 gap-3"><div class="bg-white p-4 rounded-xl">TOTAL<div id="k1" class="text-3xl font-bold">0</div></div><div class="bg-white p-4 rounded-xl">🟢 IN VN<div id="k2" class="text-3xl font-bold">0</div></div><div class="bg-white p-4 rounded-xl">✈️ TRAVEL<div id="k3" class="text-3xl font-bold">0</div></div><div class="bg-white p-4 rounded-xl">🔴 EXITED<div id="k4" class="text-3xl font-bold">0</div></div><div class="bg-white p-4 rounded-xl">⚠ WARNINGS<div id="k5" class="text-3xl font-bold">0</div></div></div><div class="bg-white p-5 rounded-xl mt-5"><h2 class="font-bold mb-3">⚠ Document Warning</h2><div class="overflow-auto"><table class="w-full text-sm"><tbody id="warnings"></tbody></table></div></div></section><section id="profile" class="pg hidden bg-white p-5 rounded-xl"><h2 class="font-bold text-xl mb-4">👤 My Profile</h2><div id="prof"></div></section><section id="imm" class="pg hidden"><div class="grid md:grid-cols-2 gap-4"><div class="bg-white p-5 rounded-xl"><h2 class="font-bold mb-4">✈️ Entry / Exit</h2><select id="et" class="input"><option>ENTRY</option><option>EXIT</option></select><input id="ed" type="datetime-local" class="input"><input id="ea" class="input" placeholder="Sân bay / cửa khẩu"><input id="ef" class="input" placeholder="Flight No."><input id="ex" class="input" placeholder="Destination"><input id="ep" class="input" placeholder="Purpose"><select id="es" class="input"><option>Planned</option><option>Completed</option></select><button class="btn w-full" onclick="saveEE()">Lưu</button></div><div class="bg-white p-5 rounded-xl"><h2 class="font-bold mb-4">History</h2><div id="eel"></div></div></div></section><section id="travel" class="pg hidden"><div class="grid md:grid-cols-2 gap-4"><div class="bg-white p-5 rounded-xl"><h2 class="font-bold mb-4">🚗 Domestic Travel</h2><input id="tf" type="date" class="input"><input id="tt" type="date" class="input"><input id="tfrom" class="input" placeholder="From"><input id="tto" class="input" placeholder="To"><input id="tp" class="input" placeholder="Purpose"><select id="tr" class="input"><option>Flight</option><option>Car</option><option>Train</option><option>Bus</option></select><select id="ts" class="input"><option>Planned</option><option>In Progress</option></select><button class="btn w-full" onclick="saveTravel()">Lưu</button></div><div class="bg-white p-5 rounded-xl"><h2 class="font-bold mb-4">History</h2><div id="tl"></div></div></div></section><section id="employees" class="pg hidden bg-white p-5 rounded-xl"><div class="flex justify-between"><h2 class="font-bold text-xl">👥 Foreign Employees</h2><button class="btn" onclick="openEmp()">＋ Add Employee</button></div><input id="search" oninput="renderEmp()" class="input mt-4" placeholder="Search..."><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="bg-slate-50"><th class="p-2 text-left">Employee</th><th class="p-2">Nationality</th><th class="p-2">Status</th><th class="p-2">Docs</th><th class="p-2">Action</th></tr></thead><tbody id="etb"></tbody></table></div></section></main><div id="modal" class="hidden fixed inset-0 modal p-4 overflow-auto"><div class="max-w-5xl mx-auto bg-white rounded-xl p-5" id="mb"></div></div><script>
const API='REPLACE_WITH_YOUR_NEW_EXEC_URL';let T=sessionStorage.getItem('T')||'',U=JSON.parse(sessionStorage.getItem('U')||'null'),ES=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function GET(a,q={}){let r=await fetch(API+'?'+new URLSearchParams({action:a,token:T,...q})),x=await r.json();if(x.status!=='SUCCESS')throw Error(x.message);return x}async function POST(a,data={}){let r=await fetch(API,{method:'POST',body:JSON.stringify({action:a,token:T,data})}),x=await r.json();if(x.status!=='SUCCESS')throw Error(x.message);return x}function hr(){return U&&['HR','HR ADMIN','DIRECTOR','ADMIN'].includes(String(U.role).toUpperCase())}function page(x){document.querySelectorAll('.pg').forEach(e=>e.classList.add('hidden'));$(x).classList.remove('hidden');if(x==='employees')loadDash()}async function login(){try{let r=await fetch(API,{method:'POST',body:JSON.stringify({action:'LOGIN',username:$('u').value,password:$('p').value})}),x=await r.json();if(x.status!=='SUCCESS')throw Error(x.message);T=x.sessionToken;U=x.user;sessionStorage.setItem('T',T);sessionStorage.setItem('U',JSON.stringify(U));enter()}catch(e){alert(e.message)}}function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userNav').classList.remove('hidden');$('userNav').classList.add('flex');$('userName').textContent=U.name;$('roleBadge').textContent=U.role;$('dm').classList.toggle('hidden',!hr());$('em').classList.toggle('hidden',!hr());page(hr()?'dash':'profile');loadProfile();loadEE();loadTravel();if(hr())loadDash()}async function loadDash(){if(!hr())return;try{let r=await GET('GET_DASHBOARD_DATA');$('k1').textContent=r.kpi.total;$('k2').textContent=r.kpi.inVN;$('k3').textContent=r.kpi.business;$('k4').textContent=r.kpi.exited;$('k5').textContent=r.kpi.warning;ES=r.employees;$('warnings').innerHTML=r.warnings.map(x=>`<tr class="border-b"><td class="p-2">${esc(x.fullName)} (${esc(x.employeeId)})</td><td class="p-2">${esc(x.type)}</td><td class="p-2">${esc(x.expiry)}</td><td class="p-2">${esc(x.status)}</td></tr>`).join('')||'<tr><td class="p-3">No warnings</td></tr>';renderEmp()}catch(e){alert(e.message)}}function renderEmp(){let q=($('search')?.value||'').toLowerCase();$('etb').innerHTML=ES.filter(e=>(e.fullName+' '+e.employeeId+' '+e.nationality).toLowerCase().includes(q)).map(e=>`<tr class="border-b"><td class="p-2"><b>${esc(e.fullName)}</b><div>${esc(e.employeeId)}</div></td><td class="p-2 text-center">${esc(e.nationality)}</td><td class="p-2 text-center">${esc(e.currentStatus)}</td><td class="p-2 text-center">${e.warningCount?'⚠ '+e.warningCount:'🟢'}</td><td class="p-2 text-center"><button onclick="detail('${encodeURIComponent(e.employeeId)}')">👁</button> <button onclick="openDoc('${esc(e.employeeId)}')">📄</button> <button onclick="openContract('${esc(e.employeeId)}')">📑</button></td></tr>`).join('')}async function detail(z){try{let r=await GET('GET_EMPLOYEE_DETAIL',{employeeId:decodeURIComponent(z)}),e=r.detail.employee;$('mb').innerHTML=`<div class="flex justify-between"><h2 class="text-xl font-bold">${esc(e.fullName)}</h2><button onclick="closeM()">✕</button></div><div class="grid md:grid-cols-3 gap-2 my-4">${f('Employee ID',e.employeeId)}${f('Nationality',e.nationality)}${f('Position',e.position)}${f('Passport',e.passportNo)}${f('Visa',e.visaNo)}${f('TRC',e.trcNo)}${f('Work Permit',e.wpNo)}${f('Status',e.currentStatus)}${f('Location',e.currentLocation)}</div><h3 class="font-bold">📑 Documents</h3><div class="overflow-auto">${r.detail.documents.map(d=>`<div class="border-b p-2 flex justify-between"><span>${esc(d.documentType)} • ${esc(d.documentNo)} • Exp: ${esc(d.expiryDate)}</span>${d.fileId?`<button onclick="viewDoc('${esc(d.documentId)}')">🖼 Xem</button>`:''}</div>`).join('')||'Chưa có'}</div><h3 class="font-bold mt-5">📄 Contracts</h3>${r.detail.contracts.map(c=>`<div class="border p-3 rounded my-2"><b>HĐ ${esc(c.contractNo)}</b> • ${esc(c.startDate)} → ${esc(c.endDate)}<br>Lương: ${esc(c.salary)} ${esc(c.salaryCurrency)}<br>Phụ cấp: ${esc(c.allowanceTotal)} ${esc(c.allowanceCurrency)}<br>${esc(c.allowanceNote)}<div class="mt-2"><button onclick="openApp('${esc(c.contractId)}','${esc(c.employeeId)}')" class="text-blue-600">＋ Phụ lục</button>${c.fileId?` <button onclick="viewContract('CONTRACT','${esc(c.contractId)}')">📄 Xem HĐ</button>`:''}</div></div>`).join('')||'Chưa có'}<button class="btn mt-4" onclick="openDoc('${esc(e.employeeId)}')">＋ Document</button> <button class="btn mt-4" onclick="openContract('${esc(e.employeeId)}')">＋ Contract</button>`;showM()}catch(e){alert(e.message)}}function f(a,b){return`<div class="bg-slate-50 p-2 rounded"><small>${a}</small><br><b>${esc(b||'-')}</b></div>`}function showM(){$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}function openEmp(){let fields=['employeeId','fullName','nationality','passportNo','passportExpiry','visaNo','visaExpiry','trcNo','trcExpiry','wpNo','wpExpiry','position','department','phone','email','currentLocation'];$('mb').innerHTML='<h2 class="font-bold text-xl">Add Employee</h2>'+fields.map(x=>`<input id="E_${x}" class="input" placeholder="${x}">`).join('')+'<button class="btn" onclick="saveEmp()">Save</button>';showM()}async function saveEmp(){let keys=['employeeId','fullName','nationality','passportNo','passportExpiry','visaNo','visaExpiry','trcNo','trcExpiry','wpNo','wpExpiry','position','department','phone','email','currentLocation'],d={currentStatus:'In Vietnam'};keys.forEach(k=>d[k]=$('E_'+k).value);try{await POST('ADD_EMPLOYEE',d);closeM();loadDash()}catch(e){alert(e.message)}}function openDoc(id){$('mb').innerHTML=`<h2 class="font-bold text-xl">Document</h2><input id="D_type" class="input" placeholder="Passport / Visa / TRC / Work Permit"><input id="D_no" class="input" placeholder="Document No."><input id="D_issue" type="date" class="input"><input id="D_exp" type="date" class="input"><input id="D_note" class="input" placeholder="Note"><input id="D_file" type="file" accept="image/*,application/pdf" class="input"><button class="btn" onclick="saveDoc('${esc(id)}')">Save</button>`;showM()}async function saveDoc(id){try{let d={employeeId:id,documentType:$('D_type').value,documentNo:$('D_no').value,issueDate:$('D_issue').value,expiryDate:$('D_exp').value,note:$('D_note').value};let f=$('D_file').files[0];if(f)Object.assign(d,await readFile(f));await POST('SAVE_DOCUMENT',d);closeM();loadDash()}catch(e){alert(e.message)}}function openContract(id){$('mb').innerHTML=`<h2 class="font-bold text-xl">Contract</h2><input id="C_no" class="input" placeholder="Số hợp đồng *"><input id="C_type" class="input" placeholder="Loại hợp đồng"><input id="C_start" type="date" class="input"><input id="C_end" type="date" class="input"><input id="C_salary" class="input" placeholder="Mức lương"><input id="C_cur" class="input" value="VND"><input id="C_allow" class="input" placeholder="Tổng phụ cấp"><input id="C_acur" class="input" value="VND"><input id="C_note" class="input" placeholder="Chi tiết phụ cấp"><input id="C_file" type="file" accept="image/*,application/pdf" class="input"><button class="btn" onclick="saveContract('${esc(id)}')">Save</button>`;showM()}async function saveContract(id){try{let d={employeeId:id,contractNo:$('C_no').value,contractType:$('C_type').value,startDate:$('C_start').value,endDate:$('C_end').value,salary:$('C_salary').value,salaryCurrency:$('C_cur').value,allowanceTotal:$('C_allow').value,allowanceCurrency:$('C_acur').value,allowanceNote:$('C_note').value};let f=$('C_file').files[0];if(f)Object.assign(d,await readFile(f));await POST('SAVE_CONTRACT',d);closeM();loadDash()}catch(e){alert(e.message)}}function openApp(cid,eid){$('mb').innerHTML=`<h2 class="font-bold text-xl">Contract Appendix</h2><input id="A_no" class="input" placeholder="Số phụ lục *"><input id="A_eff" type="date" class="input"><input id="A_end" type="date" class="input"><input id="A_sal" class="input" placeholder="Mức lương"><input id="A_cur" class="input" value="VND"><input id="A_all" class="input" placeholder="Phụ cấp"><input id="A_acur" class="input" value="VND"><input id="A_note" class="input" placeholder="Chi tiết phụ cấp"><input id="A_file" type="file" accept="image/*,application/pdf" class="input"><button class="btn" onclick="saveApp('${esc(cid)}','${esc(eid)}')">Save</button>`;showM()}async function saveApp(cid,eid){try{let d={contractId:cid,employeeId:eid,appendixNo:$('A_no').value,effectiveDate:$('A_eff').value,endDate:$('A_end').value,salary:$('A_sal').value,salaryCurrency:$('A_cur').value,allowanceTotal:$('A_all').value,allowanceCurrency:$('A_acur').value,allowanceNote:$('A_note').value};let f=$('A_file').files[0];if(f)Object.assign(d,await readFile(f));await POST('SAVE_APPENDIX',d);closeM();detail(encodeURIComponent(eid))}catch(e){alert(e.message)}}function readFile(f){return new Promise((ok,no)=>{if(f.size>8*1024*1024)return no(Error('File tối đa 8MB'));let r=new FileReader();r.onload=()=>ok({fileBase64:r.result,fileName:f.name,mimeType:f.type});r.onerror=no;r.readAsDataURL(f)})}async function viewDoc(id){try{let r=await GET('GET_DOCUMENT_IMAGE',{documentId:id});viewData(r)}catch(e){alert(e.message)}}async function viewContract(t,id){try{let r=await GET('GET_CONTRACT_FILE',{type:t,id:id});viewData(r)}catch(e){alert(e.message)}}function viewData(r){$('mb').innerHTML=`<button class="secondary" onclick="closeM()">← Back</button><h2 class="font-bold my-3">${esc(r.fileName)}</h2>${r.mimeType.startsWith('image/')?`<img class="max-h-[75vh] mx-auto" src="data:${r.mimeType};base64,${r.base64}">`:`<iframe class="w-full h-[75vh]" src="data:${r.mimeType};base64,${r.base64}"></iframe>`}`}async function loadProfile(){if(!U?.employeeId)return;try{let r=await GET('GET_PROFILE',{employeeId:U.employeeId});$('prof').innerHTML=Object.entries(r.profile).map(x=>f(x[0],x[1])).join('')}catch(e){}}async function saveEE(){try{await POST('ADD_ENTRY_EXIT',{employeeId:U.employeeId,type:$('et').value,dateTime:$('ed').value,airport:$('ea').value,flightNo:$('ef').value,destination:$('ex').value,purpose:$('ep').value,status:$('es').value});loadEE()}catch(e){alert(e.message)}}async function loadEE(){if(!U?.employeeId)return;try{let r=await GET('GET_ENTRY_EXIT',{employeeId:U.employeeId});$('eel').innerHTML=r.records.reverse().map(x=>`<div class="border-b p-2">${x.type} • ${esc(x.dateTime)} • ${esc(x.airport)} • ${esc(x.status)}</div>`).join('')||'Chưa có'}catch(e){}}async function saveTravel(){try{await POST('ADD_DOMESTIC_TRAVEL',{employeeId:U.employeeId,fromDate:$('tf').value,toDate:$('tt').value,fromLocation:$('tfrom').value,toLocation:$('tto').value,purpose:$('tp').value,transport:$('tr').value,status:$('ts').value});loadTravel()}catch(e){alert(e.message)}}async function loadTravel(){if(!U?.employeeId)return;try{let r=await GET('GET_DOMESTIC_TRAVEL',{employeeId:U.employeeId});$('tl').innerHTML=r.records.reverse().map(x=>`<div class="border-b p-2">${esc(x.fromDate)} → ${esc(x.toDate)} • ${esc(x.fromLocation)} → ${esc(x.toLocation)} • ${esc(x.status)}</div>`).join('')||'Chưa có'}catch(e){}}async function logout(){try{await POST('LOGOUT')}catch(e){}sessionStorage.clear();location.reload()}if(U&&T)enter();</script></body></html>
